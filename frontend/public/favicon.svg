<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Rime">
  <title>Rime</title>
  <!-- The tab mark is Rime's head (owner decision, 2026-09-11, issue 314). He
       replaced the "SN." relief that held this file since issue 292, and he is
       a RASTER inside the SVG rather than a traced path: the study is a shaded
       render whose whole read at 16px is the modelling — the eye, the jaw
       line, the horn silhouette — and a two-ink trace of that is a different
       drawing, not a smaller one. The bytes are the same 64px image the
       document would otherwise link, carried inline so this stays ONE file
       under the one name the document declares and the origin's icon test
       follows; a second file would be a second thing to keep in step.
       The extension is what makes it servable at all: the runtime image has
       no MIME registry beyond Go's built-in table, and .svg is in it. -->
  <image href="data:image/png;base64," x="0" y="0" width="64" height="64" />
</svg>
