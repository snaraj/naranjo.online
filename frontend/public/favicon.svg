<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="J">
  <title>J</title>
  <!-- The tab mark is J's head at his laptop (owner ruling, 2026-10-12: J
       replaces Rime everywhere the site draws its dragon). It is the same
       render the chrome row's typing mark comes from, frame 120 of the
       grounded typing scene, cropped to the horns, the eye and the snout at
       the screen's corner, with an ink edge so the pale hide holds against a
       light tab strip as well as a dark one. A RASTER inside the SVG, as Rime
       was: the read at 16px is the modelling, and a two-ink trace of that is a
       different drawing, not a smaller one. One file under the one name the
       document declares; the extension is what makes it servable at all,
       because the runtime image has no MIME registry beyond Go's built-in
       table, and .svg is in it. -->
  <image href="data:image/png;base64," x="0" y="0" width="64" height="64" />
</svg>
