<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SN.">
  <title>SN.</title>
  <!-- The site's mark as letters alone (owner directive, 2026-09-04, issue
       292): "SN." with no field behind it, the letters standing in relief.
       The outlines are Archivo at weight 900 — the wordmark's own face,
       extracted from the vendored variable font so no renderer's font stack
       decides the shape — set with the wordmark's -0.03em tracking. Relief
       is what lets an unfielded mark survive both a light and a dark tab
       strip at 16 CSS pixels: the face is the sheet's paper and the extrusion
       is its ink, five steps down and right, so on a dark strip the paper
       face reads and on a light one the ink body does. Two inks, no
       gradient, no font file, one path reused. The extrusion is drawn back
       to front so each step sits under the one before it. -->
