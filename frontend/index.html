<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
      values; without it every inset is zero and the page sits under a notch
      or a home indicator. The page itself pads by those insets, once, for
      everything inside it (rendering-lane floor, issue #26). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>naranjo.online</title>
    <!-- Link-preview identity (owner directive, 0.1.52: "when I text a link
      to the website, I expect to see a preview... SN. white and black, very
      simple"). These live in the STATIC head, not svelte:head, because the
      scrapers that build message previews read the document as served and
      run no script — a tag added at hydration does not exist for them. The
      image URL is absolute because the Open Graph spec requires a full URL,
      and it names this site's one canonical origin. -->
    <meta name="description" content="naranjo.online, served from a Raspberry Pi Kubernetes cluster." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="naranjo.online" />
    <meta property="og:title" content="Samuel Naranjo" />
    <meta property="og:description" content="naranjo.online, served from a Raspberry Pi Kubernetes cluster." />
    <meta property="og:url" content="https://naranjo.online/" />
    <meta property="og:image" content="https://naranjo.online/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SN." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app">
      <!-- The chrome row exists in BOTH shells so the controls arriving at
        hydration fill space the static document already held open, rather
        than pushing the page down. -->
      <header class="page-header"></header>
      <main aria-labelledby="static-page-title" data-static-fallback>
        <h1 id="static-page-title">Samuel Naranjo</h1>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
