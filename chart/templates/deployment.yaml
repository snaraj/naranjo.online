apiVersion: apps/v1
kind: Deployment
metadata:
  name: naranjo-online
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naranjo-online.labels" . | nindent 4 }}
  annotations:
    platform.snaraj.dev/deployment-ready: {{ .Values.deploymentReady | quote }}
    # Media remains a discovery-gated data boundary, independent from the image.
    platform.snaraj.dev/media-storage-ready: {{ .Values.media.enabled | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # The namespace quota is pods:2 / limits.memory 256Mi. At
      # replicaCount's schema maximum of 2 (values.schema.json allows 1..2;
      # the DEFAULT moved to 1 in the 2026-08-24 round-3 review so the
      # replay-floor state is single-writer by construction — see
      # chart/values.yaml, which states the availability tradeoff in full),
      # steady state already consumes the whole
      # quota, so any surge pod is quota-rejected and wedges the rollout
      # permanently (cluster-proven during the lidersea.com v0.1.16
      # deploy — the controller scaled the OLD ReplicaSet to 2 first to
      # hold the maxUnavailable 0 floor, filling the quota before the new
      # pod could schedule). Swapping one pod out before its replacement
      # starts is the only rolling path at 2 replicas, and works cleanly
      # at 1 too.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "naranjo-online.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "naranjo-online.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: naranjo-online
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: naranjo-online
          {{- /* repository:tag@digest. The digest is what Kubernetes resolves and
          what cosign and admission verify; the tag is legibility only and is
          never a substitute for it. Both are required by the values schema, so
          a chart that dropped the digest cannot render. */}}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            # The chart schema currently permits only false, and no volume is
            # rendered. Enabling media requires the reviewed ADR 0012 follow-up.
            - name: MEDIA_ENABLED
              value: {{ .Values.media.enabled | quote }}
            {{- /* The panel API's background refresh loops. Rendered ALWAYS and
            explicitly, never conditionally: an absent variable and a false one
            reach the process identically today, but a template that emits the
            switch only when it is on is one edit away from emitting nothing at
            all, and the operator loses the ability to read the deployed state
            off the manifest. The value defaults to false in values.yaml and the
            schema requires the key, so a chart that forgot to decide cannot
            render. Turning it on is an operational decision that needs the
            egress allowance too (issue #79) -- without one the refresh attempts
            simply fail and the panels keep serving their snapshots as stale,
            which is the fail-soft outcome, not an outage. */}}
            - name: PANELS_REFRESH
              value: {{ .Values.panels.refresh.enabled | quote }}
            {{- /* The panels data root (issue #142): rendered only when the
            capability is enabled, so a disabled render is byte-identical to
            the chart before the capability existed. Both this value and the
            volumeMount below come from the SAME values key, so they cannot
            drift by editing one of two literals (round-3 finding 7); the
            geometry itself — normalized, disjoint in both directions — is
            validated by naranjo-online.panelsDataPaths, and
            scripts/ci/chart-storage-pin.sh holds the rendered result. The key reference is
            optional on purpose: a missing Secret degrades the panel to its
            embedded snapshot (the app fails closed on every unreadable
            input) and must never keep the site from scheduling. */}}
            {{- if .Values.panels.data.enabled }}
            {{- include "naranjo-online.panelsDataPaths" . }}
            - name: PANELS_DATA_ROOT
              value: {{ .Values.panels.data.mountPath | quote }}
            {{- /* The replay-floor state root (2026-08-24 review finding
            H2): where the app persists the sealed floor marker so a restart
            cannot re-admit replayed ciphertext. Must equal the writable
            state volumeMount path below; the storage pin fails the render
            if the two drift. */}}
            - name: PANELS_DATA_STATE
              value: {{ .Values.panels.data.stateMountPath | quote }}
            - name: PANELS_DATA_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.panels.data.keySecret }}
                  key: PANELS_DATA_KEY
                  optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.panels.data.enabled }}
            - name: panels-data
              mountPath: {{ .Values.panels.data.mountPath }}
              readOnly: true
            {{- /* The state mount is the pod's ONE writable projection
            (2026-08-24 review finding H2): explicitly readOnly: false at
            both levels, on a separate volume, so the floor marker persists
            while the data mount above stays read-only exactly as reviewed.
            scripts/ci/chart-storage-pin.sh fails the render if the state
            mount flips read-only (a silently unwritable state root would
            quietly lose the durable floor) or the data mount flips
            writable. */}}
            - name: panels-state
              mountPath: {{ .Values.panels.data.stateMountPath }}
              readOnly: false
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- if .Values.panels.data.enabled }}
        {{- /* readOnly at BOTH levels on purpose: the claim reference makes
        the whole volume read-only toward the pod, and the mount repeats it
        so neither level can be silently relaxed alone.
        scripts/ci/chart-storage-pin.sh fails if either flag moves. */}}
        - name: panels-data
          persistentVolumeClaim:
            claimName: {{ .Values.panels.data.volumeName }}
            readOnly: true
        - name: panels-state
          persistentVolumeClaim:
            claimName: {{ .Values.panels.data.stateVolumeName }}
            readOnly: false
        {{- end }}
