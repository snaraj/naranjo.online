apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-to-naranjo-online
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naranjo-online.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "naranjo-online.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    {{- /* Only the configured ingress peer may reach the origin. The peer
    identity is injected from values — the deployment-provider binding point —
    so the template stays provider-neutral by doctrine. That identity is the
    full triple, namespace + app name + instance: the peer namespace is shared
    by several connectors that carry the SAME app name and differ only by
    instance, so dropping the instance line would admit all of them. The
    schema requires the instance, so this selector cannot render unpinned. */}}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.peerNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.ingress.peerAppName }}
              app.kubernetes.io/instance: {{ .Values.ingress.peerInstance }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
