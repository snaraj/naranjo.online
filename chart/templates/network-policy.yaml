apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-to-naranjo-online
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "naranjo-online.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "naranjo-online.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- /* Only the configured ingress peer may reach the origin. The peer
    identity is injected from values — the deployment-provider binding point —
    so the template stays provider-neutral by doctrine. That identity is the
    full triple, namespace + app name + instance: the peer namespace is shared
    by several connectors that carry the SAME app name and differ only by
    instance, so dropping the instance line would admit all of them. The
    schema requires the instance, so this selector cannot render unpinned. */}}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.peerNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.ingress.peerAppName }}
              app.kubernetes.io/instance: {{ .Values.ingress.peerInstance }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  # The site serves an embedded bundle and has no runtime dependency, so any
  # outbound connection is denied. Live panel refresh is opt-in and ships
  # disabled, so egress is impossible rather than merely unattempted; enabling
  # it is a separate reviewed decision that adds an exact allow-list, never a
  # widening of this one.
  # Verified live: the API server drops this empty list from the stored spec
  # (omitempty), so the admitted object carries the deny through the - Egress
  # entry in policyTypes alone. That entry is the load-bearing line -- dropping
  # it while leaving this one here silently restores full outbound access.
  egress: []
